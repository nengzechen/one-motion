server:
  port: 8080
  mode: debug  # debug | release

database:
  host: localhost
  port: 5432
  user: postgres
  password: postgres
  dbname: one_motion
  sslmode: disable

redis:
  host: localhost
  port: 6379
  password: ""
  db: 0

jwt:
  secret: "change-this-to-a-random-secret-in-production"
  expire_hours: 720  # 30 days

sms:
  # 阿里云短信配置
  access_key_id: ""
  access_key_secret: ""
  sign_name: ""
  template_code: ""

oss:
  # 阿里云 OSS 配置
  endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket: ""
  base_url: ""

upload:
  max_size_mb: 500     # 单次上传最大 500MB
  max_versions: 20     # 每个游戏保留最近 20 个版本
